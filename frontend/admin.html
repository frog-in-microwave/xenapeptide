<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XenaPeptides Admin Dashboard</title>

    <meta name="robots" content="noindex,nofollow">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="nav-container">

        <a href="index.html" class="nav-brand" aria-label="XenaPeptides Homepage">
            XENA<span>PEPTIDE</span>
        </a>

        <nav aria-label="Main Navigation">
            <ul id="nav-links" class="nav-links">

                <li>
                    <a href="index.html" class="active" aria-current="page">
                        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-10.5Z"/>
                        </svg>
                        Home
                    </a>
                </li>

                <li>
                    <a href="shop.html">
                        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 6h19l-2 9H7L5 3H2"/>
                            <circle cx="9" cy="20" r="1"/>
                            <circle cx="18" cy="20" r="1"/>
                        </svg>
                        Shop
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="M3 7l9 6 9-6"/>
                        </svg>
                        Contact
                    </a>
                </li>

            </ul>
        </nav>

        <div class="nav-controls">

            <div class="german-badge" title="Made in Germany" aria-label="Made in Germany">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5 3" width="28" height="17" style="display:block;border-radius:2px;">
                    <rect fill="#000000" width="5" height="1"/>
                    <rect fill="#DD0000" width="5" height="1" y="1"/>
                    <rect fill="#FFCE00" width="5" height="1" y="2"/>
                </svg>
            </div>

            <button type="button" id="hamburger-btn" class="hamburger" aria-label="Toggle Menu" aria-expanded="false"></button>

        </div>

    </div>

    <div id="nav-overlay" class="nav-overlay" aria-hidden="true"></div>

</header>

<main class="container">

    <section class="admin-header">
        <h1 class="section-title">Admin Dashboard</h1>
        <p class="section-subtitle">
            Manage products in the catalog.
        </p>
    </section>

    <section class="admin-actions">

        <button class="admin-action-btn active" data-target="add-product">
            Add Product
        </button>

        <button class="admin-action-btn" data-target="remove-product">
            Remove Product
        </button>

        <button class="admin-action-btn" data-target="edit-product">
            Edit Product
        </button>

    </section>

    <!-- ADD PRODUCT -->
    <section id="add-product" class="admin-panel active">

        <h2>Add Product</h2>

        <form id="add-product-form">

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="add-name" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="add-description" rows="6" required></textarea>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="text" id="add-price" required>
            </div>

            <div class="form-group">
                <label>Image</label>
                <input type="file" id="add-image" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">
                Add Product
                <span class="btn-loader"></span>
            </button>

        </form>

    </section>

    <!-- REMOVE PRODUCT -->
    <section id="remove-product" class="admin-panel">

        <h2>Remove Product</h2>

        <form id="remove-product-form">

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="remove-name" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Remove Product
                <span class="btn-loader"></span>
            </button>

        </form>

    </section>

    <!-- EDIT PRODUCT -->
    <section id="edit-product" class="admin-panel">

        <h2>Edit Product</h2>

        <form id="edit-product-form">

            <div class="form-group">
                <label>Existing Product Name</label>
                <input type="text" id="edit-search-name" required>
            </div>

            <div class="form-group">
                <label>New Name</label>
                <input type="text" id="edit-name">
            </div>

            <div class="form-group">
                <label>New Description</label>
                <textarea id="edit-description" rows="6"></textarea>
            </div>

            <div class="form-group">
                <label>New Price</label>
                <input type="text" id="edit-price">
            </div>

            <div class="form-group">
                <label>New Image</label>
                <input type="file" id="edit-image" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">
                Save Changes
                <span class="btn-loader"></span>
            </button>

        </form>

    </section>

</main>

<footer class="footer">
    <div class="footer-container">

        <div class="footer-brand">
            <a href="index.html" class="nav-brand">
                XENA<span>PEPTIDE</span>
            </a>
            <p>Premium laboratory peptide research logistics. Formulated and structured in Germany.</p>
        </div>

    </div>
</footer>

<script type="module" src="js/admin.js"></script>

</body>
</html>
