<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | XenaPeptides</title>

  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin-login.css">
</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="index.html" class="nav-brand">
            XENA<span>PEPTIDE</span>
        </a>

        <nav>
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="nav-controls">
            <button id="hamburger-btn" class="hamburger"></button>
        </div>

    </div>

    <div id="nav-overlay" class="nav-overlay"></div>
</header>

<main class="container">

  <section class="login-wrapper">

    <h1 class="section-title">Admin Access</h1>
    <p class="section-subtitle">Restricted area</p>

    <form id="login-form" class="login-form">

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>

      <button class="btn btn-primary" type="submit">
        Login
        <span class="btn-loader"></span>
      </button>

      <p id="error-msg" class="error-msg"></p>

    </form>

  </section>

</main>

<footer class="footer">
  <p>© 2026 XENAPEPTIDE</p>
</footer>

<script type="module" src="js/admin-login.js"></script>

</body>
</html>
